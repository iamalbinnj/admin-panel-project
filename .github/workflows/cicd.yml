name: Deploy admin panel of products

on:
  push:
    branches: [ main ]

jobs:
  deploy-client:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Set up node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependecies and build client
        working-directory: ./client
        run: |
          npm ci
          npm run build
      
      - name: configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy files to S3 bucket
        run: |
          aws s3 sync ./client/dist/ s3://${{ secrets.AWS_S3_BUCKET_CLIENT }} --delete

  build-and-push-server:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy server to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "Successfully connected to EC2!"
            uptime


            cd ~/admin-panel-project

            git pull origin main

            docker build -t admin-panel:latest ./server  

            docker stop admin-panel || true 
            docker rm admin-panel || true

            docker run -d \
              -p 5000:5000 \
              -e NODE_ENV=production \
              -e PORT=5000 \
              -e DB_URI="${{ secrets.DB_URI }}" \
              -e DNS_SERVERS="${{ secrets.DNS_SERVERS }}" \
              -e AWS_REGION="${{ secrets.AWS_REGION }}" \
              -e AWS_S3_BUCKET="${{ secrets.AWS_S3_BUCKET_PRODUCT }}" \
              -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              --name admin-panel \
              --restart always \
              admin-panel:latest

            docker image prune -f